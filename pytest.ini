[pytest]
# The core's tests, plus every installed plugin's own. A plugin is meant to be
# its own repository, so its tests travel with it rather than living here —
# but they must still run by default, or they rot the first time the core
# changes underneath them.
testpaths = tests plugins/*/tests
pythonpath = backend plugins
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
