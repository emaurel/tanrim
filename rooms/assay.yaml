id: assay
name: Assay Room
purpose: Probe weighs each lead — is it real, is it earning, is its web presence actually weak, and who do we email?
position: { x: 12, y: 4 }
size: { w: 12, h: 8 }
color: "#4a5a2b"
agents:
  - id: probe
    name: Probe
    role: Qualifier. Audits the existing site, scores the opportunity, finds the contact.
    color: "#bcd35f"
tools: ["site_audit", "social_look"]
max_workers: 10
workbenches:
  - id: qualify
    name: Weighing Bench
    job: Cheap first pass — is it real, trading, reachable, actually web-deficient?
    stages: [sourced]
  - id: research
    name: Dossier Desk
    job: Deep web research — menu, prices, verified hours, every fact sourced
    stages: [qualified]
  - id: ledger
    name: The Ledger
    job: What the business can bear — filed accounts, size, and the price we ask
    stages: [enriched]
