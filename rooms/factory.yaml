id: factory
name: Factory
purpose: Forge builds the actual website for a qualified lead — real files, on disk.
position: { x: 24, y: 4 }
size: { w: 12, h: 8 }
color: "#3d5a80"
agents:
  - id: forge
    name: Forge
    role: Builder. Turns a qualified lead into a complete, responsive static site.
    color: "#98c1d9"
# Forge's own eyes. `site_inspect` is Playwright — it renders every page at
# 390px and 1280px, measures overflow, tap targets, distorted photographs and
# text contrast against the image actually behind it, and writes PNGs Forge
# opens with Read.
#
# It was granted to the Gallery only, so Forge wrote blind: Lens looked, failed
# it, Forge rebuilt. That loop ran 3.4 builds per lead. Forge's own ROLE.md
# already referenced `inspect_site` in six places as though it could call it.
tools: ["site_inspect"]
# VARIANT B. `ui-ux-pro-max` is still vendored but no longer granted, so the
# variant-A build at /staging/sandbox-a-ui-ux-pro-max/ stays reproducible —
# put it back on this line to switch back.
#
# Four of the 27 skills the three upstream packs install. The rest are left
# out on purpose: animation skills (this page has a 150 KB critical path and a
# mandatory prefers-reduced-motion rule), React Native / Swift / Sonner skills,
# image-generation skills, and the style-variant skills — Forge already picks
# ONE treatment from REFERENCES.md, and a second prescriptive style skill is
# the incoherent-page failure mode that sheet exists to prevent.
skills: ["design-taste-frontend", "high-end-visual-design", "impeccable", "emil-design-eng"]
max_workers: 10
workbenches:
  - id: site
    name: The Build Floor
    job: Writing the site itself from the dossier and the visual report
    stages: [visualised, qa_failed]
  - id: craft
    name: Craft Bench
    job: Delegated pieces — logos, icons, CSS motifs — made with geometry, not photos
    stages: []
    tasks: [subtask]
