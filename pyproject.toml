[project]
name = "tanrim"
version = "0.0.1"
description = "An environment for agent-operated work, drawn as a place. Built on the Claude Agent SDK."
requires-python = ">=3.11"
dependencies = [
    "orjson>=3.10",
    "claude-agent-sdk>=0.1.77",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # `delegation.run_review` opens a page so a reviewing agent can LOOK at
    # what a specialist made. Plugins that render pages need it too, and say
    # so in their own requirements.
    "playwright>=1.40",
    # Not used by the core. Kept here because every plugin written so far
    # handles images somewhere, and dropping it would break three installs to
    # make one line more correct.
    "Pillow>=10.0",
]

[project.optional-dependencies]
# `pip install -e ".[dev]"`. Not a plain dependency: a deployment does not run
# the suite, and the documented install used to leave pytest out entirely
# while the README told you to run it.
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/tanrim"]
