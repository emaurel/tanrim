[project]
name = "agent-env"
version = "0.0.1"
description = "Pixel-art agent environment running an agent-operated web agency, built on the Claude Agent SDK."
requires-python = ">=3.11"
dependencies = [
    "orjson>=3.10",
    "claude-agent-sdk>=0.1.77",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # Lens renders each built site in a real browser to verify the UI.
    "playwright>=1.40",
    # Owner-supplied photos arrive straight off a phone: 4 MB, wrong-way-up,
    # and carrying GPS in the EXIF. Pillow downscales and strips them.
    "Pillow>=10.0",
]

[project.scripts]
agent-env = "agent_env.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/agent_env"]
